name: Auto Build HelloWorld (OpenWrt 24.10+)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: # 允许你在 GitHub 页面上点击按钮手动触发

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 挑选了你给出的目录中最核心、能成功编译 Go/Rust 的 12 个主流架构，避免古董架构频繁报错
        arch:
          - x86_64
          - aarch64_generic
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_cortex-a76
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a9_vfpv3-d16
          - arm_cortex-a15_neon-vfpv4
          - mipsel_24kc
          - mips_24kc
          - mipsel_74kc
          - riscv64_riscv64

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          large-packages: true
          docker-images: true

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@v7
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: packages_ci
          V: s
          VERSION: 24.10.0
          # 核心改动：在编译前，通过 SDK 的 env 机制动态将 fw876 的源码库作为 feed 注入进去
          PACKAGES: luci-app-ssr-plus
        with:
          # 在 SDK 初始化时执行自定义命令：添加 helloworld 软件源并更新安装
          env: |
            echo "src-git helloworld https://github.com/fw876/helloworld.git" >> feeds.conf.default
            ./scripts/feeds update helloworld
            ./scripts/feeds install -a -f -p helloworld

      - name: Collect IPK Files
        run: |
          mkdir -p output
          find bin/ -name "*.ipk" -exec cp {} output/ \; 2>/dev/null || true

      - name: Store Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helloworld-${{ matrix.arch }}-24.10
          path: output/*.ipk
