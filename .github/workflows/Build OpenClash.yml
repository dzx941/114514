name: Compile The New Version OpenClash

on: 
  push:
    branches:
      - dev
    paths:
      - 'luci-app-openclash/Makefile'
  workflow_dispatch:

# 核心授权：允许 GitHub Actions 机器人向你的 package 分支提交并推送代码
permissions:
  contents: write

jobs:
  Get-Version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      current_version: ${{ steps.current_version.outputs.version }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: New Version
        id: version
        run: |
          VERSION_NUM=$(grep 'PKG_VERSION:=' ./luci-app-openclash/Makefile | awk -F '=' '{print $2}' | xargs)
          echo "version=${VERSION_NUM}" >> $GITHUB_OUTPUT

      - name: Clone Repository (Package Branch)
        uses: actions/checkout@v4
        with:
          ref: package

      - name: Current Version
        id: current_version
        run: |
          if [ -f "./${{ github.ref_name }}/version" ]; then
            CURRENT_NUM=$(sed -n 1p ./${{ github.ref_name }}/version | awk -F 'v' '{print $2}' | xargs)
          else
            CURRENT_NUM="0.0.0"
          fi
          echo "version=${CURRENT_NUM}" >> $GITHUB_OUTPUT

  Compile:
    runs-on: ubuntu-latest
    needs: Get-Version
    if: ${{ needs.Get-Version.outputs.version != needs.Get-Version.outputs.current_version }}
    strategy:
      fail-fast: false
      matrix:
        target:
          # 24.10+ 环境下，IPK 使用 23.05 SDK，APK 使用最新的 SNAPSHOT SDK
          - { name: ipk, sdk_url: "https://mirrors.pku.edu.cn/openwrt/releases/23.05.5/targets/x86/64/openwrt-sdk-23.05.5-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.zst", artifact_pattern: "luci-app-openclash_*.ipk" }
          - { name: apk, sdk_url: "snapshot", artifact_pattern: "luci-app-openclash-*.apk" }
    steps:
      - name: Checkout OpenClash Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install curl git tar zstd python3 python3-pyelftools python3-setuptools jq

      - name: Download and Extract SDK
        run: |
          mkdir -p tmp/sdk
          if [ "${{ matrix.target.name }}" = "ipk" ]; then
            echo "正在下载稳定版 IPK 工具链 SDK..."
            curl -SLk --connect-timeout 30 --retry 3 "${{ matrix.target.sdk_url }}" -o tmp/sdk.tar.zst
          else
            echo "正在动态获取官方最新 SNAPSHOT APK 工具链 SDK..."
            BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64/"
            SDK_NAME=$(curl -sL $BASE_URL | grep -oE 'openwrt-sdk-x86-64[^"]+\.tar\.zst' | head -n 1)
            curl -SLk --connect-timeout 30 --retry 3 "$BASE_URL/$SDK_NAME" -o tmp/sdk.tar.zst
          fi
          
          # 24.10 时代统一采用 zst 极速解压
          tar -I zstd -xf tmp/sdk.tar.zst -C tmp/sdk --strip-components=1
          rm -f tmp/sdk.tar.zst

      - name: Copy OpenClash Source Codes
        run: |
          mkdir -p tmp/sdk/package/luci-app-openclash
          cp -rf ./luci-app-openclash/. tmp/sdk/package/luci-app-openclash/

      - name: Update Third-Party Resources
        run: |
          # 路径适配
          OC_ROOT="tmp/sdk/package/luci-app-openclash/root"
          mkdir -p "$OC_ROOT/etc/openclash" "$OC_ROOT/usr/share/openclash/ui"
          
          # 更新 IP 集
          curl -sSL https://ispip.clang.cn/all_cn.txt -o "$OC_ROOT/etc/openclash/china_ip_route.ipset"
          curl -sSL https://ispip.clang.cn/all_cn_ipv6.txt -o "$OC_ROOT/etc/openclash/china_ip6_route.ipset"

          # 更新 Dashboards 面板
          curl -sSL https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip -o tmp/meta.zip
          unzip -q -o tmp/meta.zip -d tmp/
          rm -rf "$OC_ROOT/usr/share/openclash/ui/metacubexd"
          mv tmp/metacubexd-gh-pages "$OC_ROOT/usr/share/openclash/ui/metacubexd"

          curl -sSL https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip -o tmp/zash.zip
          unzip -q -o tmp/zash.zip -d tmp/zash_dist
          rm -rf "$OC_ROOT/usr/share/openclash/ui/zashboard"
          mv tmp/zash_dist/dist "$OC_ROOT/usr/share/openclash/ui/zashboard"

          # 更新规则数据库
          curl -sSL "https://github.com/alecthw/mmdb_china_ip_list/releases/latest/download/Country-lite.mmdb" -o "$OC_ROOT/etc/openclash/Country.mmdb"
          
          # 安全拉取最新的 GeoSite
          RULES_TAG=$(curl -s "https://api.github.com/repos/Loyalsoldier/v2ray-rules-dat/releases/latest" | jq -r '.tag_name')
          curl -sSL "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/${RULES_TAG}/geosite.dat" -o "$OC_ROOT/etc/openclash/GeoSite.dat"

      - name: Compile po2lmo
        run: |
          cd tmp/sdk/package/luci-app-openclash/tools/po2lmo
          make && sudo make install

      - name: Compile OpenClash
        run: |
          cd tmp/sdk
          # 【彻底修复】原地执行 defconfig，保证工具链配置文件绝对生成
          make defconfig
          make package/luci-app-openclash/compile V=s -j$(nproc)

      - name: Collect and Organize Output
        run: |
          mkdir -p ./artifact_out
          # 【彻底修复】用 find 模糊跨路径提取生成的 ipk 或 apk，彻底解决软路由大版本更迭路径改变的问题
          find tmp/sdk/bin/ -name "${{ matrix.target.artifact_pattern }}" -exec cp {} ./artifact_out/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclash-${{ matrix.target.name }}
          path: ./artifact_out/*

  Post-Process:
    runs-on: ubuntu-latest
    needs: [Compile, Get-Version]
    steps:
      - name: Checkout package branch
        uses: actions/checkout@v4
        with:
          ref: package

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./incoming

      - name: Commit and Push New Version
        run: |
          mkdir -p "./${{ github.ref_name }}"
          rm -rf ./${{ github.ref_name }}/luci-app-openclash*
          
          # 写入版本描述元数据
          echo "v${{ needs.Get-Version.outputs.version }}" > ./${{ github.ref_name }}/version
          echo "https://img.shields.io/badge/New Release-v${{ needs.Get-Version.outputs.version }}-orange.svg" >> ./${{ github.ref_name }}/version
          
          # 从下载暂存区整理包文件到对应分支目录
          find ./incoming/ -name "*.ipk" -exec cp {} "./${{ github.ref_name }}/" \;
          find ./incoming/ -name "*.apk" -exec cp {} "./${{ github.ref_name }}/" \;
          rm -rf ./incoming
          
          # 配置 GitHub 机器人身份提交
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          
          # 检查是否有文件改动，若有则推送
          if ! git diff --cached --exit-code; then
            git commit -m "Auto Release OpenClash: v${{ needs.Get-Version.outputs.version }}"
            git push origin package
          else
            echo "没有检测到任何内容变更，跳过本次推送。"
          fi
