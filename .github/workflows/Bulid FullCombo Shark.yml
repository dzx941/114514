name: Build FCHomo Full 33 Platforms (OpenWrt 24.10+)

on:
  workflow_dispatch: # 支持在 GitHub Actions 页面点击按钮手动触发编译

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 关键：某一个架构编译失败，不会终止其他架构的任务
      matrix:
        include:
          # === 1. X86 / PC 平台 ===
          - arch: x86_64
            target: x86
            subtarget: 64
          - arch: i386_pentium4
            target: x86
            subtarget: pentium4
          - arch: i386_pentium-mmx
            target: x86
            subtarget: geode

          # === 2. 现代 ARM 64位 (AArch64) ===
          - arch: aarch64_generic
            target: armsr
            subtarget: armv8
          - arch: aarch64_cortex-a53
            target: mediatek
            subtarget: filogic
          - arch: aarch64_cortex-a72
            target: bcm27xx
            subtarget: bcm2711
          - arch: aarch64_cortex-a76
            target: rockchip
            subtarget: armv8

          # === 3. 主流 ARM 32位 (Cortex系列) ===
          - arch: arm_cortex-a5_vfpv4
            target: at91
            subtarget: sama5
          - arch: arm_cortex-a7
            target: sunxi
            subtarget: cortexa7
          - arch: arm_cortex-a7_neon-vfpv4
            target: ipq40xx
            subtarget: generic
          - arch: arm_cortex-a7_vfpv4
            target: mediatek
            subtarget: mt7629
          - arch: arm_cortex-a8_vfpv3
            target: sunxi
            subtarget: generic
          - arch: arm_cortex-a9
            target: imx
            subtarget: multiplatform
          - arch: arm_cortex-a9_neon
            target: mvebu
            subtarget: cortexa9
          - arch: arm_cortex-a9_vfpv3-d16
            target: bcm53xx
            subtarget: generic
          - arch: arm_cortex-a15_neon-vfpv4
            target: armvirt
            subtarget: 32

          # === 4. 古董级 ARM 32位 ===
          - arch: arm_arm926ej-s
            target: mxs
            subtarget: generic
          - arch: arm_arm1176jzf-s_vfp
            target: bcm27xx
            subtarget: bcm2708
          - arch: arm_fa526
            target: gemini
            subtarget: generic
          - arch: arm_xscale
            target: ixp4xx
            subtarget: generic
          - arch: armeb_xscale
            target: ixp4xx
            subtarget: generic

          # === 5. MIPS 32位 (小端 - mipsel) ===
          - arch: mipsel_24kc
            target: ramips
            subtarget: mt7621
          - arch: mipsel_24kc_24kf
            target: rdc
            subtarget: d60x0
          - arch: mipsel_74kc
            target: ramips
            subtarget: mt7620
          - arch: mipsel_mips32
            target: au1000
            subtarget: generic

          # === 6. MIPS 32位 (大端 - mips) ===
          - arch: mips_24kc
            target: ath79
            subtarget: generic
          - arch: mips_4kec
            target: lantiq
            subtarget: xway
          - arch: mips_mips32
            target: bcm47xx
            subtarget: legacy

          # === 7. MIPS 64位 ===
          - arch: mips64_mips64r2
            target: malta
            subtarget: be64
          - arch: mips64el_mips64r2
            target: malta
            subtarget: le64
          - arch: mips64_octeonplus
            target: octeon
            subtarget: generic

          # === 8. 新兴开源指令集 (RISC-V / 龙芯) ===
          - arch: riscv64_riscv64
            target: sifive
            subtarget: generic
          - arch: loongarch64_generic
            target: loongarch
            subtarget: generic

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialization Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-setuptools python3-pip rsync unzip zlib1g-dev file wget ccache swig
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: Download and Setup OpenWrt SDK
      run: |
        OP_VER="24.10.0"
        SDK_URL="https://downloads.openwrt.org/releases/${OP_VER}/targets/${{ matrix.target }}/${{ matrix.subtarget }}/openwrt-sdk-${OP_VER}-${{ matrix.target }}-${{ matrix.subtarget }}_x86-64.tar.zst"
        
        echo "=========================================================="
        echo "Arch: ${{ matrix.arch }}"
        echo "Target: ${{ matrix.target }} | Subtarget: ${{ matrix.subtarget }}"
        echo "Downloading SDK from: $SDK_URL"
        echo "=========================================================="
        
        # 使用 curl 下载 24.10+ 标准的 .tar.zst 格式 SDK，若不存在（如冷门架构下架）则优雅跳过
        if curl -f -L "$SDK_URL" -o sdk.tar.zst; then
          mkdir openwrt-sdk
          tar -xf sdk.tar.zst -C openwrt-sdk --strip-components=1
          rm -f sdk.tar.zst
          echo "SDK_READY=true" >> $GITHUB_ENV
        else
          echo "错误：未能在官方服务器上找到该架构的 SDK，可能已被上游废弃。"
          echo "SDK_READY=false" >> $GITHUB_ENV
        fi

    - name: Update and Install Feeds
      if: env.SDK_READY == 'true'
      run: |
        cd openwrt-sdk
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Clone openwrt-fchomo Source
      if: env.SDK_READY == 'true'
      run: |
        cd openwrt-sdk/package
        git clone --depth 1 https://github.com/fcshark-org/openwrt-fchomo.git

    - name: Configure and Download Dependencies
      if: env.SDK_READY == 'true'
      run: |
        cd openwrt-sdk
        make defconfig
        
        # 选中整个父级文件夹内的所有子组件包（包含 luci 面板和 mihomo 核心）
        echo "CONFIG_PACKAGE_luci-app-fchomo=m" >> .config
        echo "CONFIG_PACKAGE_mihomo=m" >> .config 
        
        make defconfig
        # 预下载所需的依赖源码
        make package/openwrt-fchomo/compile/download V=s || true

    - name: Compile Package
      if: env.SDK_READY == 'true'
      run: |
        cd openwrt-sdk
        # 24.10 工具链全速多核编译
        make package/openwrt-fchomo/compile V=s -j$(nproc)

    - name: Organize IPK Files
      if: env.SDK_READY == 'true'
      run: |
        mkdir -p ./artifact/
        # 递归抓取生成的 fchomo 和 mihomo 包
        find openwrt-sdk/bin/ -name "*fchomo*.ipk" -exec cp {} ./artifact/ \; 2>/dev/null || true
        find openwrt-sdk/bin/ -name "*mihomo*.ipk" -exec cp {} ./artifact/ \; 2>/dev/null || true
        
        echo "=== 成功编译出 [${{ matrix.arch }}] 架构的 IPK 列表 ==="
        ls -la ./artifact/

    - name: Upload Artifacts
      if: env.SDK_READY == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: fchomo-24.10-${{ matrix.arch }}-ipks
        path: ./artifact/*
