name: Build OpenWrt armv7-a5 IPK

on:
  workflow_dispatch: # 支持手动触发编译

env:
  # 已替换为官方最新的 23.05.5 版本中专属于 arm_cortex-a5-vfpv4 (at91/sama5) 的 SDK 链接
  SDK_URL: https://downloads.openwrt.org/releases/23.05.5/targets/at91/sama5/openwrt-sdk-23.05.5-at91-sama5_gcc-12.3.0_musl_eabi.Linux-x86_64.tar.xz

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialization Environment
      run: |
        sudo apt-get update
        # 移除了 python3-distutils，加入了 python3-setuptools 和 python3-pip
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-setuptools python3-pip rsync unzip zlib1g-dev file wget ccache
        
        # 兼容性补丁：如果后面有些老脚本死活要找 distutils，可以用 setuptools 虚拟一个
        python3 -c "import setuptools; print('Setuptools is ready')"

        
    - name: Download and Extract OpenWrt SDK
      run: |
        wget -q $SDK_URL -O openwrt-sdk.tar.xz
        mkdir openwrt-sdk
        tar -xf openwrt-sdk.tar.xz -C openwrt-sdk --strip-components=1
        rm -f openwrt-sdk.tar.xz

    - name: Update and Install Feeds
      run: |
        cd openwrt-sdk
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Clone openwrt-fchomo Source
      run: |
        cd openwrt-sdk/package
        git clone --depth 1 https://github.com/fcshark-org/openwrt-fchomo.git

    - name: Configure and Download Core
      run: |
        cd openwrt-sdk
        # 1. 写入默认配置并正确选择该插件
        make defconfig
        echo "CONFIG_PACKAGE_luci-app-fchomo=m" >> .config
        # 核心包通常会被自动依赖选中，为了保险也可以手动加上
        echo "CONFIG_PACKAGE_mihomo=m" >> .config 
        make defconfig
        
        # 2. 修正：下载真正的包名依赖
        make package/luci-app-fchomo/download V=s

    - name: Compile Package
      run: |
        cd openwrt-sdk
        # 3. 修正：编译真正的包名，使用所有可用CPU核心
        make package/luci-app-fchomo/compile V=s -j$(nproc)


    - name: Organize IPK Files
      run: |
        mkdir -p ./artifact/
        # 查找所有编译好的 fchomo 和 mihomo 相关的 ipk 文件并移动到打包目录
        find openwrt-sdk/bin/ -name "*fchomo*.ipk" -exec cp {} ./artifact/ \;
        find openwrt-sdk/bin/ -name "*mihomo*.ipk" -exec cp {} ./artifact/ \;
        echo "=== 编译出的文件列表 ==="
        ls -la ./artifact/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fchomo-arm-cortex-a5-ipks
        path: ./artifact/*
