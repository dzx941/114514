name: Test Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch: # 🌟 允许你手动点击按钮触发编译

jobs:
  build:
    name: Test ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 🌟 这里保留了最可能兼容 晶晨S805(玩客云) 的通用 ARMv7 32位环境
          - arch: arm_cortex-a15_neon-vfpv4
            target: armvirt-32

          # 🌟 顺便保留了 X86_64 软路由环境，不需要的话可以整行删掉
          - arch: x86_64
            target: x86-64

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine branch name
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BRANCH="${GITHUB_BASE_REF#refs/heads/}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          # 🌟 如果你在本地手动触发，分支名 fallback 到 main
          BRANCH="${BRANCH:-main}"
          echo "Building for $BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      # 🌟【新增核心步骤】拉取 helloworld 源码的 dev 分支
      - name: Clone helloworld dev branch
        run: |
          git clone -b dev --depth=1 https://github.com/fw876/helloworld.git helloworld
          # 强制设置变量告诉下游只编译我们刚刚克隆出来的 helloworld
          echo "PACKAGES=luci-app-ssr-plus" >> $GITHUB_ENV

      # 🌟【修改】由于通过 gh-action-sdk 编译组件可能需要高版本 golang
      # ImmortalWrt SDK v7 的容器内已自带环境，我们这里直接调用
      - name: Build
        uses: immortalwrt/gh-action-sdk@v7
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: packages_ci
          V: s
          target: ${{ matrix.target }}
          packages: ${{ env.PACKAGES }}

      - name: Move created packages to project dir
        run: cp bin/packages/${{ matrix.arch }}/packages_ci/*.ipk . || true

      - name: Collect metadata
        run: |
          MERGE_ID=$(git rev-parse --short HEAD 2>/dev/null || echo "manual")
          
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_ID=$(git rev-parse --short origin/$BRANCH)
            HEAD_ID=$(git rev-parse --short HEAD)
            PRNUMBER=${GITHUB_REF_NAME%/merge}
          else
            BASE_ID=$(git rev-parse --short HEAD^ 2>/dev/null || echo "init")
            HEAD_ID=$MERGE_ID
            PRNUMBER="push-$MERGE_ID"
          fi
          
          echo "MERGE_ID=$MERGE_ID" >> $GITHUB_ENV
          echo "BASE_ID=$BASE_ID" >> $GITHUB_ENV
          echo "HEAD_ID=$HEAD_ID" >> $GITHUB_ENV
          echo "PRNUMBER=$PRNUMBER" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=${{ matrix.arch }}-$PRNUMBER" >> $GITHUB_ENV

      - name: Generate metadata
        run: |
          shopt -s nullglob
          IPKS=( *.ipk )
          
          cat << EOF > PKG-INFO
          Metadata-Version: 2.1
          Name: ${{ env.ARCHIVE_NAME }}
          Version: $BRANCH
          Author: $GITHUB_ACTOR
          Home-page: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          Download-URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Summary: $PACKAGES
          Platform: ${{ matrix.arch }}

          Packages built from $PRNUMBER
          at commit $HEAD_ID.

          Modified packages:
          EOF
          
          for p in $PACKAGES; do
            echo "  $p" >> PKG-INFO
          done

          echo >> PKG-INFO
          echo "Package count: ${#IPKS[@]}" >> PKG-INFO
          echo "Package size summary:" >> PKG-INFO
          for f in "${IPKS[@]}"; do
            du -sh "$f" >> PKG-INFO
          done

          if [ ${#IPKS[@]} -eq 0 ]; then
            echo "No packages built." >> PKG-INFO
          fi

          cat PKG-INFO

      - name: Store packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}-packages
          path: |
            Packages
            Packages.*
            *.ipk
            PKG-INFO

      - name: Store logs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}-logs
          path: |
            logs/
            PKG-INFO
