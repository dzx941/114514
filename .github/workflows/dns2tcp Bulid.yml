name: Compile Static Binary for ARMv7 (Libev Auto-Build)

on:
  workflow_dispatch: # 支持在 GitHub 页面上手动点击按钮触发编译

jobs:
  compile:
    runs-on: ubuntu-22.04

    steps:
    - name: Install Tools and Cross-Compiler
      run: |
        sudo apt-get update
        # 安装适用于 32位 ARMv7 的 GCC 交叉编译器、git、wget 和编译标准件
        sudo apt-get install -y gcc-arm-linux-gnueabi git wget build-essential

    - name: Download and Build Static Libev for ARMv7
      run: |
        # 1. 下载经典稳定的 libev 4.33 源码
        wget http://dist.schmorp.de/libev/libev-4.33.tar.gz
        tar -zxf libev-4.33.tar.gz
        cd libev-4.33
        
        # 2. 配置交叉编译参数，指定生成静态库
        ./configure --host=arm-linux-gnueabi --prefix=$GITHUB_WORKSPACE/libev_install --enable-static --disable-shared
        
        # 3. 编译并安装到临时目录
        make -j$(nproc)
        make install

    - name: Clone zfl9/dns2tcp Source
      run: |
        # 克隆原版官方源码
        git clone https://github.com/zfl9/dns2tcp.git

    - name: Download and Apply Official SSR Plus Patch
      run: |
        cd dns2tcp
        # 从官方仓库直接下载针对 libev 版本的 AAAA 过滤补丁
        wget -O ssr-plus-aaaa-filter.patch https://raw.githubusercontent.com/fw876/helloworld/refs/heads/dev/dns2tcp/patches/0001-add-A-option-to-filter-AAAA-answers.patch
        
        # 精准应用补丁修改 C 源码
        patch -p1 < ssr-plus-aaaa-filter.patch

    - name: Build Static Binary for ARMv7
      run: |
        cd dns2tcp
        # 🚀 补上终极拼图：
        # 在末尾加上 `-lm`，让链接器把标准数学库也静态打包进来，彻底消灭 `undefined reference to 'floor'`
        arm-linux-gnueabi-gcc -O3 -std=c99 -static \
          -I$GITHUB_WORKSPACE/libev_install/include \
          -L$GITHUB_WORKSPACE/libev_install/lib \
          dns2tcp.c -o dns2tcp -lev -lrt -lm
        
        # 裁剪二进制文件体积
        arm-linux-gnueabi-strip dns2tcp

    - name: Upload Finished Binary
      uses: actions/upload-artifact@v4
      with:
        name: dns2tcp-armv7-static
        path: dns2tcp/dns2tcp
