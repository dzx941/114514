name: Compile Static Binary for ARMv7 (SSR Plus Official Patch)

on:
  workflow_dispatch: # 支持在 GitHub 页面上手动点击按钮触发编译

jobs:
  compile:
    runs-on: ubuntu-22.04

    steps:
    - name: Install ARMv7 Cross-Compiler
      run: |
        sudo apt-get update
        # 安装适用于 32位 ARMv7 的 GCC 交叉编译器
        sudo apt-get install -y gcc-arm-linux-gnueabi git wget

    - name: Clone zfl9/dns2tcp Source
      run: |
        # 克隆原版官方源码
        git clone https://github.com/zfl9/dns2tcp.git

    - name: Download and Apply Official SSR Plus Patch
      run: |
        cd dns2tcp
        # 🚀 完美的直接拉取你找到的 SSR Plus+ 官方原生魔改补丁
        wget -O ssr-plus-aaaa-filter.patch https://raw.githubusercontent.com/fw876/helloworld/refs/heads/dev/dns2tcp/patches/0001-add-A-option-to-filter-AAAA-answers.patch
        
        # 精准应用补丁修改 C 源码
        patch -p1 < ssr-plus-aaaa-filter.patch

    - name: Build Static Binary for ARMv7
      run: |
        cd dns2tcp
        # 使用 ARMv7 交叉编译器进行全静态编译，解开一切依赖锁
        arm-linux-gnueabi-gcc -O3 -std=c99 -static *.c -o dns2tcp -lrt
        
        # 裁剪二进制文件体积
        arm-linux-gnueabi-strip dns2tcp

    - name: Upload Finished Binary
      uses: actions/upload-artifact@v4
      with:
        name: dns2tcp-armv7-static
        path: dns2tcp/dns2tcp
